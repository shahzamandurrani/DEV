<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <title>Happy Birthday!</title>
</head>
<body>
    <div id="header">
        <h1>Today is Saif's birthday 🎉</h1>
        <img src="images/saif.jpg" alt="birthday boy" id="birthday-boy">
        <h2 id="age">16 years old</h2>
        <h4 id="date">09.09.2026</h4>
    </div>
    <div class="gift">
        <h2 class="gift-title">Here's how happy I am for you today🥳</h2>
        <h3 class="gift-hint">(Hover over the gift)</h3>
        <div class="gift-img" id="gift-img-happy"></div>
    </div>
    <div class="gift">
        <h2 class="gift-title">How people react when you enter the room.😍</h2>
        <div class="gift-img" id="gift-img-hot"></div>
    </div>
    <div class="gift">
        <h2 class="gift-title">If I had to go with you somewhere 👇</h2>
        <div class="gift-img" id="gift-img-swiss"></div>
    </div>
</body>
</html>
