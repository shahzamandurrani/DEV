<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="scoreboard-container">
        <!-- Home Team Section -->
        <div class="team">
            <h2>HOME</h2>
            <div class="score-box">
                <span id="home-score">0</span>
            </div>
            <div class="btn-container">
                <button onclick="addHome(1)">+ 1</button>
                <button onclick="addHome(2)">+ 2</button>
                <button onclick="addHome(3)">+ 3</button>
            </div>
        </div>

        <!-- Guest Team Section -->
        <div class="team">
            <h2>GUEST</h2>
            <div class="score-box">
                <span id="guest-score">0</span>
            </div>
            <div class="btn-container">
                <button onclick="addGuest(1)">+ 1</button>
                <button onclick="addGuest(2)">+ 2</button>
                <button onclick="addGuest(3)">+ 3</button>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
